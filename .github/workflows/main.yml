name: Build Android App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Hämta kod
        uses: actions/checkout@v4

      - name: Sätt upp Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sätt upp Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Installera paket & bygg webbapp
        run: |
          npm install
          npm run build

      - name: Skapa & synka Android-projekt (Capacitor)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Bygg Android APK (för test på mobilen)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Ladda upp färdig APK
        uses: actions/upload-artifact@v4
        with:
          name: BetterKeep-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
