name: Build Android App & Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kod
        uses: actions/checkout@v4

      - name: Sätt versionsnummer
        id: version
        run: |
          VER="1.0.${{ github.run_number }}"
          echo "version=$VER" >> $GITHUB_OUTPUT
          npm version "$VER" --no-git-tag-version --allow-same-version

      - name: Installera Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sätt upp Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Installera paket & bygg webbapp
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Synka Capacitor & bygg APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../BetterKeep-v${{ steps.version.outputs.version }}.apk

      - name: Publicera GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: BetterKeep v${{ steps.version.outputs.version }}
          body: Automatiskt bygge från main (${{ github.sha }})
          files: BetterKeep-v${{ steps.version.outputs.version }}.apk
          make_latest: true
