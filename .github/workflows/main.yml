name: Build Android App & Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kod
        uses: actions/checkout@v4

      - name: Installera Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sätt versionsnummer
        id: version
        run: |
          VER="1.0.${{ github.run_number }}"
          echo "version=$VER" >> $GITHUB_OUTPUT
          npm version "$VER" --no-git-tag-version --allow-same-version

      - name: Sätt upp Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cacha Android-signeringsnyckel
        uses: actions/cache@v4
        with:
          path: ~/.android/betterkeep.keystore
          key: android-signing-keystore-v1

      - name: Förbered fast Android-keystore
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/betterkeep.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/betterkeep.keystore -alias betterkeep -keyalg RSA -keysize 2048 -validity 10000 -storepass betterkeep123 -keypass betterkeep123 -dname "CN=BetterKeep, OU=App, O=BetterKeep, L=Uppsala, C=SE"
          fi
          cp -f ~/.android/betterkeep.keystore ~/.android/debug.keystore
          keytool -list -v -keystore ~/.android/betterkeep.keystore -storepass betterkeep123 | grep -E "Alias name|SHA1|SHA256" || true

      - name: Installera paket & bygg webbapp
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Lägg till Android & bygg APK
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ ! -f "android/gradlew" ]; then
            npx cap add android
          fi
          npx cap sync android
          STRINGS_XML="android/app/src/main/res/values/strings.xml"
          if [ -f "$STRINGS_XML" ]; then
            sed -i 's|<string name="app_name">.*</string>|<string name="app_name">BetterKeep</string>|' "$STRINGS_XML"
            sed -i 's|<string name="title_activity_main">.*</string>|<string name="title_activity_main">BetterKeep</string>|' "$STRINGS_XML"
          fi
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          for PERM in \
            "android.permission.POST_NOTIFICATIONS" \
            "android.permission.SCHEDULE_EXACT_ALARM" \
            "android.permission.REQUEST_INSTALL_PACKAGES" \
            "android.permission.RECORD_AUDIO" \
            "android.permission.MODIFY_AUDIO_SETTINGS" \
            "android.permission.ACCESS_FINE_LOCATION" \
            "android.permission.ACCESS_COARSE_LOCATION"
          do
            if ! grep -q "$PERM" "$MANIFEST"; then
              sed -i "s|</manifest>|    <uses-permission android:name=\"$PERM\" />\n</manifest>|" "$MANIFEST"
            fi
          done
          if ! grep -q "android.intent.action.SEND" "$MANIFEST"; then
            sed -i 's|</activity>|            <intent-filter>\n                <action android:name="android.intent.action.SEND" />\n                <category android:name="android.intent.category.DEFAULT" />\n                <data android:mimeType="image/*" />\n            </intent-filter>\n            <intent-filter>\n                <action android:name="android.intent.action.SEND" />\n                <category android:name="android.intent.category.DEFAULT" />\n                <data android:mimeType="text/plain" />\n            </intent-filter>\n        </activity>|' "$MANIFEST"
          fi
          sed -i "s/versionCode [0-9][0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i 's/versionName ".*"/versionName "1.0.${{ github.run_number }}"/' android/app/build.gradle
          test -f ~/.android/betterkeep.keystore
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../BetterKeep-v1.0.${{ github.run_number }}.apk

      - name: Publicera GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: BetterKeep v${{ steps.version.outputs.version }}
          body: Automatiskt bygge från main (${{ github.sha }})
          files: BetterKeep-v${{ steps.version.outputs.version }}.apk
          make_latest: true
